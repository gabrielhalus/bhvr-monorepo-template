services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-bunstack}
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The one-shot jobs (migrations, bootstrap) reuse the image built by the `api`
  # service: same Dockerfile, same context. Without that sharing, Compose builds
  # and exports the same 1.3 GB image three times.
  migrations:
    image: ${COMPOSE_PROJECT_NAME:-bunstack}-api:latest
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /usr/src/app/packages/shared
    command: ["bun", "run", "drizzle:migrate"]
    entrypoint: []
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-bunstack}

  bootstrap:
    image: ${COMPOSE_PROJECT_NAME:-bunstack}-api:latest
    depends_on:
      migrations:
        condition: service_completed_successfully
    working_dir: /usr/src/app/packages/shared
    command: ["bun", "run", "bootstrap"]
    entrypoint: []
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-bunstack}
      # Seeds the storage.s3.* configs on first boot (DB is the runtime source of truth).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    expose:
      - "9000"
      - "9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    # Buckets are provisioned by the API at boot (ensureStorageBuckets); this only
    # gates readiness on MinIO being reachable.
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # Explicit tag: the one-shot jobs above refer to it.
    image: ${COMPOSE_PROJECT_NAME:-bunstack}-api:latest
    restart: unless-stopped
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - "3000"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-admin}@postgres:5432/${POSTGRES_DB:-bunstack}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SYSTEM_RESET_PASSWORD: ${SYSTEM_RESET_PASSWORD:-false}
      # One proxy in front of the API: the app container's nginx.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      # Both empty by default — the API derives its origin from each request, so
      # the stack runs on any hostname with no configuration.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-}

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      args:
        BUILD_HASH: ${BUILD_HASH:-}
    restart: unless-stopped
    depends_on:
      - api
    # Nothing is bound on the host: nginx serves the SPA and proxies /api to the
    # API, so the whole stack lives behind one origin, reached through the host's
    # own reverse proxy.
    expose:
      - "80"

volumes:
  pgdata:
  redisdata:
  miniodata:
